<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Varadero App">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Varadero App</title>
<style>
:root{--bg:#eef2ea;--card:#fbfcf8;--ink:#17231a;--mute:#5d6b60;--line:#cfd8ca;--a:#ff5f00;--b:#5f6b65;--ok:#2f7d4f;--loss:#b83a2e;--gold:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1a251d;--ink:#e8efe6;--mute:#93a397;--line:#2e3d32;--a:#ff9326;--b:#aab5ae;--ok:#6fcf97;--loss:#ff8a7a;--gold:#f2c14e}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1a251d;--ink:#e8efe6;--mute:#93a397;--line:#2e3d32;--a:#ff9326;--b:#aab5ae;--ok:#6fcf97;--loss:#ff8a7a;--gold:#f2c14e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:0 16px 60px}
h1{font:800 1.5rem/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.02em}
h2{font:700 1.15rem Georgia,serif;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
button,label.btn{font:600 .95rem inherit;font-family:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-block}
button.ghost,label.btn{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--a);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hint{color:var(--mute);font-size:.88rem}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:12px}
.pl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}
.pl.off{opacity:.45;cursor:not-allowed}
.pl.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pl b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-variant-numeric:tabular-nums;color:var(--mute)}
.alt{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.alt>header{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--bg);font-weight:600;font-size:.88rem;flex-wrap:wrap}
.alt>header em{font-style:normal;color:var(--ok);font-size:.8rem;font-weight:500}
.teams{display:grid;grid-template-columns:1fr 1fr}
.team{padding:10px 10px}
.team+.team{border-left:1px solid var(--line)}
.team h3{margin:0 0 6px;font-size:1rem}
.A h3{color:var(--a)}.B h3{color:var(--b)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.team li{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:.88rem;font-weight:600;white-space:nowrap}
.tot{margin-top:6px;font-size:.78rem;font-weight:600}
.A .tot{color:var(--a)}.B .tot{color:var(--b)}
.sk{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:5px}
.bar{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;font-size:.85rem}
.bar .lb{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.dv{position:relative;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.dv:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mute);opacity:.7}
.dv i{position:absolute;top:2px;bottom:2px;border-radius:3px;min-width:3px}
.dv .ia{right:50%;background:var(--a)}.dv .ib{left:50%;background:var(--b)}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lg{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600}
.sc{font-size:.75rem;color:var(--mute);text-align:center}
.gkb{background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:1rem;opacity:.45;line-height:1.4}
.gkb.on{opacity:1;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.opt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.92rem}
.opt select,.opt input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.opt input{width:70px}
.err{color:var(--b);font-weight:600}
@media(max-width:320px){.teams{grid-template-columns:1fr}.team+.team{border-left:0;border-top:1px solid var(--line)}}
#toast{position:fixed;left:50%;top:calc(var(--hh,150px) + env(safe-area-inset-top,0px) + 8px);transform:translate(-50%,-10px);max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
#q{width:100%;margin-top:6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);margin:0 -16px 12px;padding:10px 16px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#cnt2{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--mute)}
#top #q{margin-top:8px}
.brow{display:flex;gap:8px;margin-top:8px}
.brow button{flex:1;padding:9px 10px}
.alt.chosen{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.foot{padding:10px 12px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-top:8px}.tabs button{flex:1;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips button{flex:none;border-radius:999px;padding:6px 12px;font-size:.85rem}
.sum{color:var(--mute);font-size:.82rem;margin:8px 0 0}
.pod{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin:16px 0 0}
.pod button{background:none;color:var(--ink);border:0;padding:0;text-align:center;font-weight:400;display:flex;flex-direction:column;align-items:center;min-width:0}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card);border:2px solid var(--line);flex:none}
.pod .p1 .av{width:58px;height:58px;border-color:var(--gold);font-size:1.1rem}
.pod .n{font-weight:700;font-size:.88rem;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .v{font:800 1.05rem Georgia,serif;font-variant-numeric:tabular-nums}
.pod .blk{width:100%;margin-top:6px;border-radius:10px 10px 0 0;background:var(--bg);border:1px solid var(--line);border-bottom:0;font:800 1.3rem Georgia,serif;color:var(--mute);display:grid;place-items:center}
.pod .p1 .blk{height:80px;background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--gold)}.pod .p2 .blk{height:60px}.pod .p3 .blk{height:44px}
.rl{border-top:1px solid var(--line)}
.rw{width:100%;display:grid;grid-template-columns:1.8em minmax(0,7em) 1fr 3.2em;gap:8px;align-items:center;padding:9px 2px;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;font-weight:400;text-align:left;font-size:.9rem}
.rw:hover{background:var(--bg)}
.rw .r{color:var(--mute);font-weight:700}.rw .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .tr{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.rw .tr i{display:block;height:100%;background:var(--ok);border-radius:6px}.rw .tr i.neg{background:var(--loss)}
.rw .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.back{background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 12px;margin-top:12px}
.hd{display:flex;gap:12px;align-items:center;margin:14px 0 12px}.hd .av{width:56px;height:56px;background:var(--ink);color:var(--bg);border:0;font:800 1.2rem Georgia,serif}
.hd .nm{font:800 1.3rem Georgia,serif;line-height:1.2}.hd .s{color:var(--mute);font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-bottom:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
.tile b{display:block;font:800 1.15rem Georgia,serif;font-variant-numeric:tabular-nums}.tile span{font-size:.7rem;color:var(--mute)}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}.box h3{margin:0 0 8px;font-size:.85rem;color:var(--mute);font-weight:600}
.donut{display:flex;gap:16px;align-items:center}.lg{font-size:.85rem;display:grid;gap:3px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.strip{display:flex;flex-wrap:wrap;gap:3px}.strip i{width:11px;height:11px;border-radius:2px}.strip i.n{background:var(--line)}
.lk{font-size:.8rem;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.G{background:var(--ok)}.E{background:var(--mute)}.P{background:var(--loss)}
.rb{display:inline-block;min-width:1.7em;text-align:center;border-radius:6px;font-weight:700;font-size:.78rem;padding:1px 5px;color:var(--card)}
.mvp{color:var(--gold);font-weight:700}
.ml{list-style:none;margin:0;padding:0}.ml li{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.85rem}
.ml .who{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.duo div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem}.duo small{display:block;color:var(--mute);font-size:.75rem}
.vban{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--a) 12%,var(--card));border:1px solid var(--a);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.92rem}
.vban[hidden]{display:none}.vban button{flex:none}
.vwho{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.vwho button{text-align:left}.vwho small{color:var(--ok);font-weight:700}
.vt{font:700 .95rem Georgia,serif;margin:16px 0 2px}.vt.A{color:var(--a)}.vt.B{color:var(--b)}
.vr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.vr .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vr .n small{color:var(--mute);font-weight:400}
.stars{display:flex;gap:4px;flex:none}
.stars button{width:38px;height:38px;padding:0;border-radius:8px;background:transparent;color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stars button.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.vfoot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:12px -16px -16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:0 0 12px 12px}
.vfoot button:disabled{opacity:.45;cursor:not-allowed}
a.btn{display:inline-block;font-weight:600;font-size:.95rem;border-radius:8px;padding:9px 14px;text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.pie{margin-top:28px;text-align:center;font-size:.78rem;color:var(--mute);letter-spacing:.02em}
</style>
</head>
<body>
<main>
<header id="top">
 <div class="trow"><h1>Varadero App</h1><span id="cnt2"></span></div>
 <div class="tabs" id="tabs" hidden><button data-tab="eq">Equipos</button><button class="ghost" data-tab="st">Estadísticas</button></div>
 <div id="ctl" hidden>
  <input id="q" type="search" placeholder="Buscar jugador…" autocomplete="off" aria-label="Buscar jugador">
  <div class="brow"><button class="ghost" id="none">Limpiar selección</button><button id="go">Armar equipos</button></div>
 </div>
</header>

<p id="msg" class="hint">Cargando jugadores…</p>
<div id="vban" class="vban" hidden></div>

<section id="sel" hidden>
<h2>¿Quiénes juegan hoy? <span class="hint" id="cnt"></span></h2>
<p class="hint" style="margin:8px 0 0">Tocá 🧤 en quien juega de arquero hoy (máximo 2).</p>
<div id="list"></div>
<select id="fis" hidden></select><input id="bonus" type="hidden" value="0.5">
<div id="err" class="err"></div>
</section>

<div id="out"></div>
<section id="vote" hidden>
<div class="trow"><h2 style="margin:0">Votación</h2><button class="ghost" data-vclose>Cerrar</button></div>
<div id="vbody"></div>
</section>
<section id="stats" hidden>
<h2>Estadísticas</h2>
<div class="opt" style="margin-top:0"><label>Período <select id="per"></select></label></div>
<div id="stbody"></div>
</section>
<footer class="pie">Un producto de la comisión I+D</footer>
</main>
<div id="toast" role="alert" aria-live="assertive"></div>
<script>
let P=[],K=[],sel=new Set(),gk=new Set(),cands=[],page=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>parseFloat(String(v).replace(",","."));
const avg=p=>p.v.reduce((a,b)=>a+b,0)/p.v.length;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fetchS(k){try{return localStorage.getItem(k)}catch(e){return null}}

function apply(cols,out,cfg){
 K=cols;P=out;M=cfg&&Array.isArray(cfg.partidos)?cfg.partidos:null;VOT=cfg&&Array.isArray(cfg.votaciones)?cfg.votaciones:[];
 sel=new Set(P.length<=10?P.map((_,i)=>i):[]);gk=new Set();
 $("fis").innerHTML=K.map((k,i)=>`<option value="${i}">${esc(k)}</option>`).join("");
 let g=cfg&&cfg.fis!=null?K.indexOf(cfg.fis):-1;if(g<0)g=K.findIndex(k=>/f[ií]s|physic|stamina|resist/i.test(k));if(g>=0)$("fis").value=g;if(cfg&&cfg.bonus!=null)$("bonus").value=cfg.bonus;
 $("tabs").hidden=false;setTab(TAB);render();$("out").innerHTML="";
}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function render(){
 $("list").innerHTML=P.map((p,i)=>!norm(p.name).includes(norm($("q").value))?"":`<div class="pl ${sel.has(i)?"on":""}${sel.size>=10&&!sel.has(i)?" off":""}" role="checkbox" aria-checked="${sel.has(i)}" aria-disabled="${sel.size>=10&&!sel.has(i)}" tabindex="0" data-i="${i}"><input type="checkbox" tabindex="-1" ${sel.has(i)?"checked":""} ${sel.size>=10&&!sel.has(i)?"disabled":""}><b>${esc(p.name)}</b><button class="gkb ${gk.has(i)?"on":""}" data-gk="${i}" title="Arquero" aria-pressed="${gk.has(i)}" ${sel.size>=10&&!sel.has(i)?"disabled":""}>🧤</button></div>`).join("");
 if(!$("list").innerHTML.trim())$("list").innerHTML='<p class="hint">Sin resultados.</p>';
 $("cnt").textContent="("+sel.size+" de 10)";$("cnt2").textContent=sel.size+"/10";
}
const setHH=()=>document.documentElement.style.setProperty("--hh",$("top").offsetHeight+"px");
if(window.ResizeObserver)new ResizeObserver(setHH).observe($("top"));window.addEventListener("resize",setHH);setHH();
let tt;function toast(m){const t=$("toast");clearTimeout(tt);t.textContent=m;t.className="show";tt=setTimeout(()=>{t.className=""},3200)}
function addSel(i){if(sel.has(i))return true;if(sel.size>=10){toast("Ya elegiste 10 jugadores. Sacá a alguien para sumar otro.");return false}$("err").textContent="";sel.add(i);return true}
function toggle(el){const i=+el.dataset.i;if(sel.has(i)){sel.delete(i);gk.delete(i);$("err").textContent=""}else if(!addSel(i))return;render()}
$("list").addEventListener("click",e=>{const g=e.target.closest(".gkb");if(g){const i=+g.dataset.gk;$("err").textContent="";if(gk.has(i))gk.delete(i);else if(gk.size>=2){toast("Máximo 2 arqueros por partido.");return}else if(addSel(i))gk.add(i);else return;render();return}const el=e.target.closest(".pl");if(el)toggle(el)});
$("list").addEventListener("keydown",e=>{if(e.target.closest(".gkb"))return;if(e.key===" "||e.key==="Enter"){const el=e.target.closest(".pl");if(el){e.preventDefault();toggle(el);$("list").querySelector(`[data-i="${el.dataset.i}"]`).focus()}}});
$("none").onclick=()=>{sel.clear();gk.clear();$("err").textContent="";render()};

const pop=x=>{let c=0;while(x){x&=x-1;c++}return c};
function build(){
 $("err").textContent="";
 const ids=[...sel].sort((a,b)=>a-b),n=ids.length;
 if(n!==10){const f=10-n;toast(f>0?"Faltan "+f+(f>1?" jugadores":" jugador")+" para llegar a 10.":"Elegí exactamente 10 jugadores.");return}
 if(gk.size>2){toast("Máximo 2 arqueros por partido.");return}
 const k=n/2,m=K.length,V=ids.map(i=>P[i].v);
 const VIS0=K.map((_,j)=>j).filter(j=>!/arquer|total/i.test(K[j])),VIS=VIS0.length?VIS0:K.map((_,j)=>j);
 const tot=Array(m).fill(0);V.forEach(v=>v.forEach((x,j)=>tot[j]+=x));
 const G=ids.map(id=>gk.has(id)),gkN=G.filter(Boolean).length,fj=+$("fis").value,bonus=Math.max(0,parseFloat($("bonus").value)||0);
 const FI=ids.map(id=>P[id].v[fj]);
 const all=[];
 (function rec(i,c,mask){
  if(c===k){all.push(mask);return}
  if(n-i<k-c)return;
  rec(i+1,c+1,mask|(1<<i));rec(i+1,c,mask);
 })(1,1,1);
 const scored=all.map(mask=>{
  const s=Array(m).fill(0);
  let fa=0,na=0,fb=0,nb=0;
  for(let i=0;i<n;i++){
   const inA=mask>>i&1;
   if(inA)for(let j=0;j<m;j++)s[j]+=V[i][j];
   if(!G[i]){if(inA){fa+=FI[i];na++}else{fb+=FI[i];nb++}}
  }
  const aG=k-na,bG=k-nb;
  if(gkN>=2&&(aG===0||bG===0))return null;
  const t=(aG>0&&bG===0)?bonus:(bG>0&&aG===0)?-bonus:0;
  const sa=s.slice(),sb=s.map((x,j)=>tot[j]-x);
  sa[fj]=k*fa/na;sb[fj]=k*fb/nb;
  let dsum=0,dabs=0;
  for(const j of VIS){const d=s[j]-(tot[j]-s[j]);dsum+=d;dabs+=j===fj?Math.abs(sa[j]-sb[j]-k*t):Math.abs(d)}
  const overall=Math.abs(dsum)/VIS.length;
  return {mask,cost:overall*2+dabs/VIS.length,overall,s,sa,sb,t,fj};
 }).filter(Boolean).sort((a,b)=>a.cost-b.cost);
 const pick=[];
 for(const c of scored){
  if(pick.every(p=>k-pop(p.mask&c.mask)>=2)){pick.push(c);if(pick.length>=3)break}
 }
 cands=pick.map(c=>({...c,ids,n,k,tot}));
 page=0;chosen=-1;show();
}
let LO=0,HI=1;
function radar(c){
 const RK=K.map((_,j)=>j).filter(j=>!/arquer|total/i.test(K[j])),n=RK.length,R=110,cx=170,cy=150;
 const ang=i=>-Math.PI/2+2*Math.PI*i/n;
 const pt=(i,v)=>{const r=Math.max(0,(v-LO)/(HI-LO))*R;return [cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))]};
 let g="";

  h+=`<div class="box"><h3>Nota por partido (${pts.length})</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Nota por partido, promedio ${f1(av)}">
  <line x1="12" x2="${W-12}" y1="${Y(av)}" y2="${Y(av)}" style="stroke:var(--mute)" stroke-dasharray="4 4"/><text x="${W-12}" y="${Y(av)-6}" text-anchor="end" style="font:11px sans-serif;fill:var(--mute)">promedio ${f1(av)}</text>
  <polyline fill="none" style="stroke:var(--a)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+","+Y(p.nota)).join(" ")}"/>
  ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.nota)}" r="${p.mvp?5:3.5}" style="fill:var(${p.mvp?"--gold":"--a"})"><title>${fd(p.m.f)}: ${f1(p.nota)}${p.mvp?" (MVP)":""}</title></circle>`).join("")}
  <text x="12" y="${H-2}" style="font:11px sans-serif;fill:var(--mute)">${md(pts[0].m.f)}</text><text x="${W-12}" y="${H-2}" text-anchor="end" style="font:11px sans-serif;fill:var(--mute)">${md(pts[pts.length-1].m.f)}</text></svg>
  ${pts.some(p=>p.mvp)?'<p class="hint" style="margin:4px 0 0">Punto dorado = MVP.</p>':""}</div>`;
 }
 h+=`<div class="box"><h3>Todos sus partidos, del primero al último</h3><div class="strip" role="img" aria-label="${s.g} ganados, ${s.e} empatados, ${s.p} perdidos, ${s.pj-s.jr} sin resultado">${mine.map(x=>`<i class="${x.r||"n"}" title="${fd(x.m.f)}: ${x.r?RW[x.r]:"sin resultado"}"></i>`).join("")}</div>
 <div class="lg" style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.75rem"><span><i class="G"></i>ganado</span><span><i class="E"></i>empate</span><span><i class="P"></i>perdido</span><span><i style="background:var(--line)"></i>sin resultado</span></div></div>`;
 const duo=(t,o,txt,res)=>`<div><small>${t}</small>${res&&!F?`<span class="hint">Sin partidos con resultado</span>`:o?`<b>${esc(o.n)}</b> · ${txt(o)}`:`<span class="hint">Todavía no hay datos suficientes</span>`}</div>`;
 h+=`<div class="duo">${duo("Mejor dupla (más victorias juntos)",bt,o=>`${o.g} de ${o.j} ganados`,1)}${duo("Compañero más frecuente",freq,o=>`${o.j} partido${o.j>1?"s":""} juntos`)}${duo("Bestia negra (más derrotas en contra)",bn,o=>`${o.p} de ${o.j} perdidos`,1)}</div>`;
 h+=`<div class="box"><h3>Últimos partidos</h3><ul class="ml">${mine.slice().reverse().slice(0,10).map(x=>`<li><span>${fd(x.m.f)}</span>${x.has?`<span class="rb ${x.r}" title="${RW[x.r]}">${x.r}</span>`:`<span class="rb E" style="opacity:.5" title="sin resultado">?</span>`}<span class="who">${x.has?x.f+"–"+x.c+" · ":""}con ${esc(x.t.filter(n=>n!==name).join(", "))}</span><span>${x.mvp?'<span class="mvp" title="MVP">★ </span>':""}${x.nota!=null?f1(x.nota):""}</span></li>`).join("")}</ul></div>`;
 return h;
}
$("stbody").addEventListener("click",e=>{
 const r=e.target.closest("[data-rk]");if(r){RK=r.dataset.rk;renderStats();return}
 if(e.target.closest("[data-back]")){DET=null;renderStats();$("stats").scrollIntoView({block:"start"});return}
 const p=e.target.closest("[data-pl]");if(p){DET=p.dataset.pl;renderStats();$("stats").scrollIntoView({block:"start"})}
});
$("per").onchange=renderStats;
/* ---------- votación de puntajes ---------- */
// El script abre la votación el día siguiente al partido y la cierra a los 2 días.
// Cada jugador del partido elige su nombre y puntúa a los 10 de 1 a 5.
let VOT=[],PREV="eq",VF=null,VV=null,VN={},VDONE=false;
const fdl=f=>{const d=new Date(f+"T12:00:00");const w=isNaN(d)?"":d.toLocaleDateString("es",{weekday:"long"});return (w?w+" ":"")+fd(f)};
const voteUrl=()=>location.origin+location.pathname+"?votar";
function renderBanner(){
 const b=$("vban");
 if(!VOT.length||TAB==="vo"){b.hidden=true;return}
 const v=VOT[0],n=v.a.length+v.b.length;
 b.hidden=false;
 b.innerHTML=`<span>🗳 <b>Votación abierta</b> · partido del ${esc(fdl(v.f))} · votaron ${v.votaron.length} de ${n}</span><button data-vopen>Votar</button>`;
}
$("vban").addEventListener("click",e=>{if(e.target.closest("[data-vopen]")){VDONE=false;setTab("vo");window.scrollTo(0,0)}});
function renderVote(){
 const b=$("vbody");
 if(!VOT.length){b.innerHTML='<p class="hint">No hay ninguna votación abierta en este momento. Se abre el día siguiente a cada partido y dura 2 días.</p>';return}
 if(!VOT.some(v=>v.f===VF)){VF=VOT[0].f;VN={}}
 const v=VOT.find(x=>x.f===VF),all=[...v.a,...v.b];
 if(!VV){const s=fetchS("vvname");if(s&&all.includes(s))VV=s}
 if(VV&&!all.includes(VV))VV=null;
 const share=`<a class="btn" href="https://wa.me/?text=${encodeURIComponent("🗳 Votación del partido del "+fdl(v.f)+": puntuá a los jugadores de 1 a 5. "+voteUrl())}" target="_blank" rel="noopener">Compartir en WhatsApp</a>`;
 let h=VOT.length>1?`<div class="opt"><label>Partido <select data-vf>${VOT.map(x=>`<option value="${x.f}"${x.f===VF?" selected":""}>${esc(fdl(x.f))}</option>`).join("")}</select></label></div>`:"";
 h+=`<p class="hint">Partido del ${esc(fdl(v.f))}. La votación cierra el ${esc(fdl(v.cierra))} a la noche. Puntuá a los ${all.length} jugadores de 1 a 5 (5 es el mejor). El MVP es el de promedio más alto.</p>`;
 if(VDONE){
  h+=`<p style="font-weight:700;color:var(--ok)">✓ Listo, ${esc(VV)}: tu voto quedó guardado.</p><p class="hint">Votaron ${v.votaron.length} de ${all.length}${v.votaron.length?": "+esc(v.votaron.join(", ")):""}. Si querés cambiar algo, podés votar de nuevo y vale el último voto.</p><div class="row"><button data-vagain class="ghost">Votar de nuevo</button>${share}</div>`;
 }else if(!VV){
  h+=`<h3 class="vt">¿Quién sos?</h3><div class="vwho">${all.slice().sort((x,y)=>x.localeCompare(y,"es")).map(n=>`<button class="ghost" data-vv="${esc(n)}">${esc(n)}${v.votaron.includes(n)?" <small>✓ votó</small>":""}</button>`).join("")}</div>
  <p class="hint" style="margin-top:14px">Votaron ${v.votaron.length} de ${all.length}. ¿Falta alguien?</p>${share}`;
 }else{
  const k=all.filter(n=>VN[n]).length;
  h+=`<div class="trow" style="margin-top:4px"><span>Votás como <b>${esc(VV)}</b></span><button class="ghost" data-vv="">No soy yo</button></div>`;
  if(v.votaron.includes(VV))h+=`<p class="hint">Ya votaste: si votás de nuevo, se reemplaza tu voto anterior.</p>`;
  [["Equipo A",v.a,"A"],["Equipo B",v.b,"B"]].forEach(([t,l,c])=>{
   h+=`<h3 class="vt ${c}">${t}</h3>`+l.map(n=>`<div class="vr"><span class="n">${esc(n)}${n===VV?" <small>(vos)</small>":""}</span><span class="stars" role="group" aria-label="Puntaje para ${esc(n)}">${[1,2,3,4,5].map(x=>`<button class="${VN[n]===x?"on":""}" data-vp="${esc(n)}" data-vs="${x}" aria-pressed="${VN[n]===x}" aria-label="${x} para ${esc(n)}">${x}</button>`).join("")}</span></div>`).join("");
  });
  h+=`<div class="vfoot"><span class="hint" style="margin:0">Puntuaste ${k} de ${all.length}</span><button data-vsend ${k<all.length?"disabled":""}>Enviar voto</button></div>`;
 }
 b.innerHTML=h;
}
$("vote").addEventListener("click",e=>{
 const t=e.target;
 if(t.closest("[data-vclose]")){setTab(PREV);window.scrollTo(0,0);return}
 const w=t.closest("[data-vv]");if(w){VV=w.dataset.vv||null;VN={};if(VV)store("vvname",VV);renderVote();if(VV)window.scrollTo(0,0);return}
 const s=t.closest("[data-vp]");if(s){VN[s.dataset.vp]=+s.dataset.vs;renderVote();return}
 if(t.closest("[data-vagain]")){VDONE=false;VN={};renderVote();return}
 const go=t.closest("[data-vsend]");if(go)sendVote(go);
});
$("vote").addEventListener("change",e=>{if(e.target.matches("[data-vf]")){VF=e.target.value;VN={};VDONE=false;renderVote()}});
async function sendVote(btn){
 btn.disabled=true;btn.textContent="Enviando…";
 try{
  const r=await fetch(CFG.script+"?action=votar&token="+encodeURIComponent(CFG.token)+"&p="+encodeURIComponent(JSON.stringify({f:VF,v:VV,n:VN})));
  const d=await r.json();
  if(!d.ok){toast(d.error||"No se pudo guardar el voto.");btn.disabled=false;btn.textContent="Enviar voto";return}
  toast(d.reemplazo?"Voto actualizado. ¡Gracias!":"¡Gracias! Tu voto quedó guardado.");
  VDONE=true;VN={};
  const v=VOT.find(x=>x.f===VF);if(v&&!v.votaron.includes(VV))v.votaron.push(VV);
  refreshVotes();renderVote();window.scrollTo(0,0);
 }catch(e){toast("No se pudo enviar. Revisá tu conexión e intentá de nuevo.");btn.disabled=false;btn.textContent="Enviar voto"}
}
function refreshVotes(){
 if(!CFG.script)return;
 fetch(CFG.script+"?action=votacion&token="+encodeURIComponent(CFG.token),{cache:"no-store"}).then(r=>r.json()).then(d=>{if(d.ok&&Array.isArray(d.votaciones)){VOT=d.votaciones;if(TAB==="vo")renderVote();renderBanner()}}).catch(()=>{});
}
const fromJson=()=>fetch("jugadores.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{apply(d.cols,d.players,d);$("msg").textContent=""});
const msgErr=()=>{$("msg").textContent="No se pudieron cargar los jugadores. Avisale al administrador.";$("msg").className="err"};
fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({})).then(c=>{
 CFG={script:((c&&c.script)||"").trim(),token:((c&&c.token)||"").trim()};
 if(!CFG.script)return fromJson().catch(msgErr);
 return fetch(CFG.script+"?action=base&token="+encodeURIComponent(CFG.token),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  if(!d.ok)throw d.error||0;
  if(!d.players||!d.players.length)throw "La hoja no tiene jugadores.";
  apply(d.cols,d.players,d);$("msg").textContent="";store("f5base",JSON.stringify(d));
  if(/[?&]votar\b/.test(location.search)&&VOT.length)setTab("vo");else renderBanner();
 }).catch(e=>{
  console.error("Varadero: no se pudo leer la hoja:",e);
  const raw=typeof e==="string"?e:((e&&e.message)||"");
  const why=typeof e==="string"?e:(/JSON|Unexpected token|<!DOCTYPE/i.test(raw)?"la dirección del script no devolvió datos: revisá que sea la URL /exec y que el acceso sea \"Cualquier persona\"":(/fetch|network|load failed/i.test(raw)?"el navegador no pudo conectar con Google":(raw||"sin respuesta")));
  let c2=null;try{c2=JSON.parse(fetchS("f5base")||"null")}catch(x){}
  if(c2&&c2.cols){apply(c2.cols,c2.players,c2);VOT=[];renderBanner();$("msg").textContent="";toast("Sin conexión con la hoja: uso la última copia guardada.");return}
  return fromJson().then(()=>{$("msg").textContent="⚠ No se pudo leer la hoja ("+why+"). Se muestran los jugadores de respaldo.";$("msg").className="err"}).catch(msgErr);
 });
});
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
